[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplens"
version = "0.1.0"
description = "MCP server security scanner with runtime behavioral verification — checks that tools actually do what their descriptions claim."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karmendra Pandey" }]
keywords = ["mcp", "model-context-protocol", "security", "scanner", "ai-agents", "tool-poisoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcplens = "mcplens.cli:main"

[project.urls]
Homepage = "https://github.com/karmendra8386/mcplens"
Repository = "https://github.com/karmendra8386/mcplens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
